spring.datasource.url=jdbc:postgresql://ep-calm-frost-b3o9n6rz-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_8pns7ImxgDGF


