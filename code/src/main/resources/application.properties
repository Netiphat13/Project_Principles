spring.application.name=splitbill

# ---------- Database (PostgreSQL) ----------
# ตั้งค่าผ่าน environment variable (ค่าเริ่มต้นตรงกับ docker-compose.yml: `docker compose up -d postgres`)
# ตัวอย่าง Neon/Cloud:  DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require  DB_USER=...  DB_PASSWORD=...
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/splitmate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:splitmate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:splitmate}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.ignore-migration-patterns=*:missing

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/html/
springdoc.swagger-ui.path=/swagger-ui.html

# อัปโหลดสลิป/ใบเสร็จได้ไม่เกิน 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080
