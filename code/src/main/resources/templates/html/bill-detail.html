<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>รายละเอียดบิล - SplitMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
</head>

<body>
    <div class="shell">
        <aside class="side">
            <a href="/home" class="logo">
                <i>ıl</i>
                <div><b>SplitMate</b><small>EAT TOGETHER. PAY FAIR.</small></div>
            </a>

            <a class="nav" href="/home">🏠<span>แดชบอร์ด</span></a>
            <a class="nav" href="/bills/new">➕<span>สร้างบิล</span></a>
            <a class="nav active" href="/bills">🧾<span>บิลของฉัน</span></a>
            <a class="nav" href="/stats">📊<span>สถิติ</span></a>
            <a class="nav" href="/profile">👤<span>โปรไฟล์</span></a>

            <div class="promo">
                ✨<b>หารแฟร์ขึ้นอีกขั้น</b>
                ให้ Smart Split ช่วยแนะนำวิธีที่เหมาะที่สุด<br>
                <a href="/bills/new" style="color:var(--g-d);font-weight:600">ลองเลย →</a>
            </div>

            <div class="me">
                <div class="av" data-pinit>P</div>
                <div>
                    <b style="font-size:13px" data-pname></b>
                    <div class="muted" style="font-size:10px" data-pemail></div>
                </div>
            </div>
        </aside>

        <div>
            <header class="top">
                <span class="muted">SplitMate › <b style="color:var(--ink)">รายละเอียดบิล</b></span>

                <div class="row">
                    <input class="search" placeholder="ค้นหา..." aria-label="ค้นหา">
                    <button class="btn ghost" id="bell" style="padding:8px" aria-label="แจ้งเตือน">🔔</button>
                    <a href="/profile" class="av" data-pinit>P</a>
                </div>
            </header>

            <main class="main">
                <a href="/bills" style="color:var(--g-d);font-weight:600;font-size:12px">← กลับไปบิลของฉัน</a>
                <div id="box" style="margin-top:12px"></div>
            </main>
        </div>
    </div>

    <script src="../../static/js/app.js" th:src="@{/js/app.js}"></script>
    <script>
        const METHOD_LABEL = {
            equal: 'หารเท่ากัน',
            item: 'ตามรายการที่กิน',
            percentage: 'ตามสัดส่วน',
            treat: 'เลี้ยงเพื่อน',
            custom: 'กำหนดเอง'
        };
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
        const id = qid();

        let me, b, cfg, members = [], pending = [], payments = [], found = null, lookupMsg = '', lookupTimer, lookupSeq = 0;

        const isOwner = () => b && me && b.createdById === me.id;
        const joinLink = () => location.origin + '/join?code=' + encodeURIComponent(b.joinCode || '');

        const copyText = async (text, btn, label) => {
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            }
            btn.textContent = 'คัดลอกแล้ว ✓';
            setTimeout(() => { btn.textContent = label; }, 1500);
        };

        // ข้อมูลการแบ่งที่หน้าสร้างบิลบันทึกไว้ (สมาชิก, ยอดแต่ละคน, ใครกินอะไร)
        const splitInfo = () => {
            const names = Array.isArray(cfg.members) && cfg.members.length ? cfg.members : [b.createdByName];
            const total = Number(b.totalAmount || 0);
            const shares = cfg.shares || Object.fromEntries(names.map(n => [n, total / names.length]));
            const items = Array.isArray(cfg.items) && cfg.items.length
                ? cfg.items
                : (b.items || []).map(i => ({ name: i.name, qty: i.quantity, price: Number(i.unitPrice), eaters: names }));
            return { names, shares, items };
        };

        const lookupHtml = () => found
            ? `<div class="kv">
                    <span><b>${esc(found.username)}</b><span class="muted" style="display:block">${esc(found.email)}</span></span>
                    <button type="button" class="btn soft sm" id="invBtn">＋ เชิญ</button>
               </div>`
            : (lookupMsg ? `<p class="muted" style="margin-top:6px">${esc(lookupMsg)}</p>` : '');

        const lookup = email => {
            clearTimeout(lookupTimer);
            found = null;
            lookupMsg = '';
            const v = email.trim();
            const seq = ++lookupSeq;
            if (!EMAIL_RE.test(v)) {
                $('#invr').innerHTML = '';
                return;
            }
            lookupTimer = setTimeout(async () => {
                try {
                    const u = await api.get('/api/v1/users/lookup?email=' + encodeURIComponent(v));
                    if (seq !== lookupSeq) return;
                    if (u.id === me.id) lookupMsg = 'นี่คืออีเมลของคุณเอง';
                    else if (members.some(m => m.userId === u.id)) lookupMsg = 'คนนี้อยู่ในบิลแล้ว';
                    else if (pending.some(p => p.inviteeId === u.id)) lookupMsg = 'เชิญคนนี้ไปแล้ว รอการตอบรับ';
                    else found = u;
                } catch (err) {
                    if (seq !== lookupSeq) return;
                    lookupMsg = err.status === 404 ? 'ไม่พบผู้ใช้ที่ใช้อีเมลนี้' : err.message;
                }
                $('#invr').innerHTML = lookupHtml();
                const btn = $('#invBtn');
                if (btn) btn.onclick = invite;
            }, 250);
        };

        async function invite() {
            const btn = $('#invBtn');
            if (!found) return;
            btn.disabled = true;
            try {
                await api.post('/api/v1/bills/' + id + '/invitations', { inviteeId: found.id });
                notify('ส่งคำเชิญถึง ' + found.username + ' แล้ว');
                found = null;
                await reload();
            } catch (err) {
                lookupMsg = err.message;
                found = null;
                $('#invr').innerHTML = lookupHtml();
            }
        }

        // ---------- สถานะการจ่ายเงินและสลิปรายสมาชิก ----------
        const PAY_OPTIONS = ['PENDING', 'PAID', 'OVERDUE'];
        const payKey = s => ({ PAID: 'paid', OVERDUE: 'overdue' }[String(s || '').toUpperCase()] || 'pending');
        const payLabel = s => ST[String(s || 'PENDING').toUpperCase()] || 'รอจ่าย';
        const payOptions = cur => PAY_OPTIONS
            .map(k => `<option value="${k}"${cur === k ? ' selected' : ''}>${ST[k]}</option>`).join('');
        const when = ts => ts
            ? new Date(ts).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })
            : '-';
        const payUrl = p => '/api/v1/bills/' + id + '/payments/' + p.id + '/slip';
        const slipUrl = p => payUrl(p) + '?v=' + encodeURIComponent(p.slipUploadedAt || '');
        const myPayment = () => payments.find(p => !p.owner && p.memberName === me.username);

        // รูปสลิป (ถ้าเปิดเป็นรูปไม่ได้ เช่น PDF จะเปลี่ยนเป็นปุ่มเปิดไฟล์)
        function slipPreview(p) {
            const url = slipUrl(p);
            return `<img class="payment-slip-preview" data-slip-url="${url}" src="${url}" alt="สลิปของ ${esc(p.memberName)}">
                <div class="muted slip-meta">ส่งเมื่อ ${when(p.slipUploadedAt)} ·
                    <a href="${url}" target="_blank" rel="noopener">เปิดไฟล์เต็ม ↗</a></div>`;
        }

        function memberStatusCard(p) {
            const mineRow = p.memberName === me.username;
            const canSee = p.hasSlip && (isOwner() || mineRow);
            let slipBody;
            if (canSee) slipBody = slipPreview(p);
            else if (p.hasSlip) slipBody = '<p class="muted" style="margin-top:8px">ส่งสลิปแล้ว (เห็นได้เฉพาะเจ้าของบิลและเจ้าของสลิป)</p>';
            else slipBody = '<p class="muted" style="margin-top:8px">ยังไม่มีสลิปจากสมาชิกคนนี้</p>';

            return `<div class="payment-member">
                <div class="row sp payment-member-head">
                    <div class="row" style="gap:10px">
                        <div class="av" style="width:38px;height:38px">${esc((p.memberName[0] || '?').toUpperCase())}</div>
                        <div>
                            <b>${esc(p.memberName)}</b>${mineRow ? ' <span class="muted">(คุณ)</span>' : ''}
                            ${p.owner ? '<span class="pill paid" style="margin-left:7px">เจ้าของบิล</span>' : ''}
                            <div class="muted">ต้องจ่าย ${baht(p.amount)}</div>
                        </div>
                    </div>
                    ${isOwner() && !p.owner && p.id
                        ? `<select class="in payment-status" data-pid="${p.id}" data-name="${esc(p.memberName)}"
                                aria-label="สถานะการจ่ายของ ${esc(p.memberName)}">${payOptions(p.status)}</select>`
                        : `<span class="pill ${payKey(p.status)}">${payLabel(p.status)}</span>`}
                </div>

                ${p.owner
                    ? '<div class="owner-paid-note">เจ้าของบิลไม่ต้องส่งสลิปผ่านระบบ</div>'
                    : `<div class="slip-box">
                        <div class="row sp">
                            <b>สลิปการชำระเงิน</b>
                            ${p.hasSlip ? '<span class="pill paid">ส่งแล้ว</span>' : '<span class="pill pending">ยังไม่ส่ง</span>'}
                        </div>
                        ${slipBody}
                        ${isOwner() && p.hasSlip
                            ? '<div class="muted" style="margin-top:8px">ตรวจสลิปแล้วจึงเปลี่ยนสถานะเป็น “จ่ายแล้ว”</div>'
                            : ''}
                    </div>`}
            </div>`;
        }

        // การ์ดให้สมาชิกส่งสลิปของตัวเอง
        function selfPaymentCard() {
            const mine = myPayment();
            if (isOwner()) return '';
            if (!mine) {
                return `<div class="card" style="margin-top:16px">
                    <h2>ส่งสลิปการชำระเงิน</h2>
                    <p class="muted" style="margin-top:8px">ชื่อของคุณไม่อยู่ในรายการแบ่งของบิลนี้ ติดต่อเจ้าของบิลเพื่อตรวจสอบยอด</p>
                </div>`;
            }
            const ready = !!mine.id;
            return `<div class="card payment-self-card" style="margin-top:16px">
                <div class="row sp">
                    <div>
                        <span class="tag">MY PAYMENT</span>
                        <h2 style="margin:7px 0 2px">ส่งสลิปการชำระเงิน</h2>
                        <p class="muted">หลังโอนเงินแล้ว อัปโหลดรูปหรือ PDF สลิปของคุณ เจ้าของบิลจะเป็นคนตรวจสอบ</p>
                    </div>
                    <span class="pill ${payKey(mine.status)}">${payLabel(mine.status)}</span>
                </div>
                ${ready
                    ? `<div class="payment-upload">
                        <input id="slipFileMine" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" hidden>
                        <button type="button" class="btn" id="mySlipBtn">📎 ${mine.hasSlip ? 'เปลี่ยนสลิป' : 'เพิ่มสลิป'}</button>
                        ${mine.hasSlip ? '<button type="button" class="btn ghost" id="mySlipDel">ลบสลิป</button>' : ''}
                        <span class="muted">JPG, PNG, WEBP, GIF, PDF · ไม่เกิน 8 MB</span>
                    </div>
                    <p class="err" id="mySlipErr"></p>
                    ${mine.hasSlip ? `<div style="margin-top:12px">${slipPreview(mine)}</div>` : ''}`
                    : '<p class="muted" style="margin-top:10px">เจ้าของบิลยังไม่ได้เปิดบิลนี้เพื่อสร้างรายการชำระเงิน กลับมาส่งสลิปได้ภายหลัง</p>'}
            </div>`;
        }

        // สลิป/ใบเสร็จของบิลที่เจ้าของบิลแนบไว้
        function slipHtml() {
            if (!b.hasSlip) {
                return `<p class="muted" style="margin-top:10px">${isOwner() ? 'ยังไม่ได้แนบสลิป/ใบเสร็จ' : 'เจ้าของบิลยังไม่ได้แนบสลิป/ใบเสร็จ'}</p>`;
            }
            const url = '/api/v1/bills/' + id + '/slip?v=' + Date.now();
            return `
                <img class="receipt-preview receipt-detail" data-slip-url="${url}" src="${url}" alt="สลิป/ใบเสร็จของบิล">
                <a class="muted" href="${url}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px">เปิดไฟล์เต็ม ↗</a>`;
        }

        function render() {
            const { names, shares, items } = splitInfo();
            const total = Number(b.totalAmount || 0);
            const mine = myPayment();
            const owner = isOwner();
            const paidCount = payments.filter(p => String(p.status).toUpperCase() === 'PAID').length;

            $('#box').innerHTML = `
                <div class="head">
                    <div>
                        <span class="tag">BILL DETAIL</span>
                        <h1>${esc(b.restaurantName)}</h1>
                        <p class="muted">📅 ${fmtDate(b.billDate)} ${esc(b.billTime ? String(b.billTime).slice(0, 5) : '')} · 👤 เจ้าของบิล: ${esc(b.createdByName)}</p>
                    </div>
                    <span class="pill ${statusKey(b.status)}" style="font-size:13px">${statusLabel(b.status)}</span>
                </div>

                <div class="invite-card">
                    <div>
                        <span class="tag">INVITE FRIENDS</span>
                        <h2 style="margin:7px 0 4px">ชวนเพื่อนเข้าร่วมบิลนี้</h2>
                        <p class="muted">ส่งรหัสหรือลิงก์ให้เพื่อน หรือเชิญด้วยอีเมลของเพื่อนที่มีบัญชีแล้ว</p>
                        <div class="field" style="margin:10px 0 0;max-width:340px">
                            <input class="in" id="invq" type="email" placeholder="อีเมลเพื่อน เช่น name@email.com" autocomplete="off">
                        </div>
                        <div id="invr"></div>
                    </div>

                    <div class="invite-code-wrap">
                        <span class="muted">รหัสเข้าร่วมบิล</span>
                        <span class="code">${esc(b.joinCode || '-')}</span>
                        <button class="btn ghost sm" id="copyCode" type="button">คัดลอกรหัส</button>
                        <button class="btn ghost sm" id="copyLink" type="button">คัดลอกลิงก์</button>
                    </div>
                </div>

                <div class="grid g2">
                    <div class="card">
                        <h2>ข้อมูลบิล</h2>
                        <div class="kv"><span class="muted">ยอดรวม</span><b>${baht(total)}</b></div>
                        <div class="kv"><span class="muted">จำนวนคน</span><b>${names.length} คน</b></div>
                        <div class="kv"><span class="muted">เฉลี่ยต่อคน</span><b>${baht(total / Math.max(names.length, 1))}</b></div>
                        <div class="kv"><span class="muted">วิธีหาร</span><span>${esc(METHOD_LABEL[b.splitMethod] || b.splitMethod || '-')}</span></div>
                        <div class="kv"><span class="muted">โน้ต</span><span>${esc(b.note) || '-'}</span></div>
                    </div>

                    <div class="card">
                        <h2>จัดการบิล</h2>
                        ${owner
                            ? `<p class="muted" style="margin-top:8px">คุณเป็นเจ้าของบิล สามารถตรวจสลิปและเปลี่ยนสถานะการชำระของสมาชิกได้</p>
                               <div class="field" style="margin-top:12px">
                                   <label for="s">สถานะรวมของบิล</label>
                                   <select class="in" id="s">
                                       ${['PENDING', 'PAID', 'OVERDUE', 'CANCELLED'].map(k =>
                                           `<option value="${k}"${String(b.status).toUpperCase() === k ? ' selected' : ''}>${ST[k]}</option>`).join('')}
                                   </select>
                               </div>
                               <button class="btn danger block" id="del">ลบบิลนี้</button>`
                            : `<div class="kv" style="margin-top:8px">
                                   <span class="muted">สถานะของคุณ</span>
                                   ${mine
                                       ? `<span class="pill ${payKey(mine.status)}">${payLabel(mine.status)}</span>`
                                       : '<span class="muted">-</span>'}
                               </div>
                               <div class="kv">
                                   <span class="muted">ยอดที่คุณต้องจ่าย</span>
                                   <b>${mine ? baht(mine.amount) : (shares[me.username] === undefined ? '-' : baht(shares[me.username]))}</b>
                               </div>
                               <div class="kv">
                                   <span class="muted">สถานะบิล</span>
                                   <span class="pill ${statusKey(b.status)}">${statusLabel(b.status)}</span>
                               </div>`
                        }
                    </div>
                </div>

                ${selfPaymentCard()}

                <div class="card" style="margin-top:16px">
                    <div class="row sp">
                        <div>
                            <span class="tag">PAYMENT REVIEW</span>
                            <h2 style="margin:7px 0 2px">ตรวจสอบการชำระเงินของสมาชิก</h2>
                            <p class="muted">${owner
                                ? 'ดูสลิปที่สมาชิกส่งมา และเปลี่ยนสถานะหลังตรวจสอบยอดเรียบร้อย'
                                : 'สถานะการจ่ายเงินของสมาชิกในบิลนี้'}</p>
                        </div>
                        <span class="muted">${paidCount}/${payments.length} คนจ่ายแล้ว</span>
                    </div>
                    <p class="err" id="payErr"></p>
                    <div class="payment-members">
                        ${payments.map(memberStatusCard).join('')}
                    </div>
                </div>

                <div class="card" style="margin-top:16px">
                    <div class="row sp">
                        <h2>สมาชิกที่มีบัญชีในบิลนี้</h2>
                        <span class="muted">${members.length} คน</span>
                    </div>
                    <div class="list">
                        ${members.map(m => `
                            <div>
                                <div class="av" style="width:36px;height:36px">${esc((m.username[0] || '?').toUpperCase())}</div>
                                <div style="flex:1">
                                    <b>${esc(m.username)}</b>${m.userId === me.id ? ' <span class="muted">(คุณ)</span>' : ''}
                                    <div class="muted">${esc(m.email)}</div>
                                </div>
                                <span class="pill ${m.role === 'OWNER' ? 'paid' : 'pending'}">${m.role === 'OWNER' ? 'เจ้าของบิล' : 'สมาชิก'}</span>
                            </div>
                        `).join('')}
                        ${pending.map(p => `
                            <div>
                                <div class="av" style="width:36px;height:36px;opacity:.5">${esc((p.inviteeName[0] || '?').toUpperCase())}</div>
                                <div style="flex:1">
                                    <b>${esc(p.inviteeName)}</b>
                                    <div class="muted">เชิญโดย ${esc(p.inviterName)}</div>
                                </div>
                                <span class="pill cancelled">รอตอบรับ</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="card" style="margin-top:16px">
                    <h2>รายการอาหารและผู้ร่วมจ่าย</h2>
                    ${items.length
                        ? '<div class="list">' + items.map(i => `
                            <div>
                                <span style="font-size:20px">${esc(i.icon || '🍽️')}</span>
                                <div style="flex:1">
                                    <b>${esc(i.name)}</b>
                                    <div class="muted">× ${Number(i.qty || 1)} · กินโดย ${esc((i.eaters && i.eaters.length ? i.eaters : names).join(', '))}</div>
                                </div>
                                <b>${baht(Number(i.price || 0) * Number(i.qty || 1))}</b>
                            </div>
                        `).join('') + '</div>'
                        + '<h2 style="margin:18px 0 4px">ยอดที่แต่ละคนต้องจ่าย</h2>'
                        + '<div class="list">' + payments.map(p => `
                            <div>
                                <b style="flex:1">${esc(p.memberName)}${p.memberName === me.username ? ' <span class="muted">(คุณ)</span>' : ''}</b>
                                <b>${baht(p.amount)}</b>
                                <span class="pill ${payKey(p.status)}">${payLabel(p.status)}</span>
                            </div>
                        `).join('') + '</div>'
                        + `<p class="muted" style="margin-top:10px">
                            ส่วนลด ${baht(b.discount)} · Service ${baht(b.serviceCharge)} · VAT ${baht(b.vat)}${cfg.fairness !== undefined ? ' · Fairness ' + Number(cfg.fairness) + '/100' : ''}
                        </p>`
                        : empty('🍽️', 'ยังไม่มีรายการ', 'บิลนี้ไม่มีรายการอาหาร')
                    }
                </div>

                <div class="card" style="margin-top:16px">
                    <div class="row sp">
                        <h2>ใบเสร็จจากผู้สร้างบิล</h2>
                        ${owner
                            ? `<div class="row">
                                   <input id="slipFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" hidden>
                                   <button type="button" class="btn ghost sm" id="slipBtn">📎 ${b.hasSlip ? 'เปลี่ยนไฟล์' : 'แนบไฟล์'}</button>
                               </div>`
                            : ''}
                    </div>
                    ${owner ? '<p class="muted">JPG, PNG, WEBP, GIF หรือ PDF · ไม่เกิน 8 MB</p>' : ''}
                    <p class="err" id="slipErr"></p>
                    ${slipHtml()}
                </div>
            `;

            // รูปที่เปิดเป็นรูปไม่ได้ (เช่น PDF) -> เปลี่ยนเป็นปุ่มเปิดไฟล์
            $$('img[data-slip-url]').forEach(img => {
                img.addEventListener('error', () => {
                    const u = img.dataset.slipUrl;
                    img.outerHTML = `<div class="slip-pdf"><span>📄</span>
                        <div><b>ไฟล์สลิป</b><div class="muted">เปิดดูในแท็บใหม่</div></div>
                        <a class="btn ghost sm" href="${u}" target="_blank" rel="noopener">เปิดดู</a></div>`;
                }, { once: true });
            });

            $('#copyCode').onclick = e => copyText(b.joinCode || '', e.target, 'คัดลอกรหัส');
            $('#copyLink').onclick = e => copyText(joinLink(), e.target, 'คัดลอกลิงก์');
            $('#invq').oninput = e => lookup(e.target.value);

            // เจ้าของบิล: เปลี่ยนสถานะรวม (สมาชิกทุกคนเปลี่ยนตาม)
            const s = $('#s');
            if (s) {
                s.onchange = async e => {
                    try {
                        await api.patch('/api/v1/bills/' + id + '/status', { status: e.target.value });
                        notify('อัปเดตสถานะบิล "' + b.restaurantName + '" แล้ว');
                        await reload();
                    } catch (err) {
                        alert('อัปเดตสถานะไม่สำเร็จ: ' + err.message);
                        await reload();
                    }
                };
            }

            // เจ้าของบิล: เปลี่ยนสถานะการจ่ายของสมาชิกทีละคน
            $$('.payment-status').forEach(sel => {
                sel.onchange = async e => {
                    const t = e.target;
                    t.disabled = true;
                    try {
                        await api.patch('/api/v1/bills/' + id + '/payments/' + t.dataset.pid + '/status', { status: t.value });
                        notify('อัปเดตสถานะการชำระของ ' + t.dataset.name + ' แล้ว');
                    } catch (err) {
                        $('#payErr').textContent = 'อัปเดตสถานะไม่สำเร็จ: ' + err.message;
                    }
                    await reload();
                };
            });

            const del = $('#del');
            if (del) {
                del.onclick = async () => {
                    if (!confirm('ลบบิลนี้ใช่หรือไม่?')) return;
                    try {
                        await api.delete('/api/v1/bills/' + id);
                        notify('ลบบิล "' + b.restaurantName + '" แล้ว');
                        location = '/bills';
                    } catch (err) {
                        alert('ลบบิลไม่สำเร็จ: ' + err.message);
                    }
                };
            }

            // สมาชิก: ส่ง/เปลี่ยน/ลบสลิปของตัวเอง
            const mineBtn = $('#mySlipBtn');
            const mineFile = $('#slipFileMine');
            if (mineBtn && mineFile) {
                mineBtn.onclick = () => mineFile.click();
                mineFile.onchange = async e => {
                    const f = e.target.files?.[0];
                    e.target.value = '';
                    if (!f) return;
                    if (f.size > 8 * 1024 * 1024) {
                        $('#mySlipErr').textContent = 'ไฟล์ใหญ่เกิน 8 MB';
                        return;
                    }
                    mineBtn.disabled = true;
                    try {
                        await api.upload('/api/v1/bills/' + id + '/payments/' + myPayment().id + '/slip', f);
                        notify('ส่งสลิปการชำระเงินสำหรับบิล "' + b.restaurantName + '" แล้ว');
                        await reload();
                    } catch (err) {
                        $('#mySlipErr').textContent = 'ส่งสลิปไม่สำเร็จ: ' + err.message;
                        mineBtn.disabled = false;
                    }
                };
            }

            const mineDel = $('#mySlipDel');
            if (mineDel) {
                mineDel.onclick = async () => {
                    if (!confirm('ลบสลิปของคุณใช่หรือไม่?')) return;
                    mineDel.disabled = true;
                    try {
                        await api.delete('/api/v1/bills/' + id + '/payments/' + myPayment().id + '/slip');
                        notify('ลบสลิปการชำระเงินแล้ว');
                        await reload();
                    } catch (err) {
                        $('#mySlipErr').textContent = 'ลบสลิปไม่สำเร็จ: ' + err.message;
                        mineDel.disabled = false;
                    }
                };
            }

            // เจ้าของบิล: แนบ/เปลี่ยนใบเสร็จของบิล
            const slipBtn = $('#slipBtn');
            const slipFile = $('#slipFile');
            if (slipBtn && slipFile) {
                slipBtn.onclick = () => slipFile.click();
                slipFile.onchange = async e => {
                    const f = e.target.files?.[0];
                    e.target.value = '';
                    if (!f) return;
                    if (f.size > 8 * 1024 * 1024) {
                        $('#slipErr').textContent = 'ไฟล์ใหญ่เกิน 8 MB';
                        return;
                    }
                    slipBtn.disabled = true;
                    try {
                        await api.upload('/api/v1/bills/' + id + '/slip', f);
                        notify('แนบสลิปของบิล "' + b.restaurantName + '" แล้ว');
                        await reload();
                    } catch (err) {
                        $('#slipErr').textContent = 'อัปโหลดไม่สำเร็จ: ' + err.message;
                        slipBtn.disabled = false;
                    }
                };
            }
        }

        // รายการชำระเงินของบิล — บิลเก่าที่ยังไม่มี เจ้าของบิลเปิดครั้งแรกจะสร้างให้จากข้อมูลการแบ่งเดิม
        async function loadPayments() {
            let list = await api.get('/api/v1/bills/' + id + '/payments');
            if (list.length) return list;

            const { names, shares } = splitInfo();
            const paidMap = cfg.paid || {};
            const allPaid = String(b.status).toUpperCase() === 'PAID';
            const roster = names.map(n => ({
                name: n,
                amount: Math.round(Number(shares[n] || 0) * 100) / 100,
                paid: allPaid || !!paidMap[n]
            }));

            if (isOwner()) {
                try {
                    list = await api.put('/api/v1/bills/' + id + '/payments', { payments: roster });
                } catch {}
            }
            if (list.length) return list;

            // ยังสร้างไม่ได้ (สมาชิกเปิดก่อนเจ้าของบิล) -> แสดงจากข้อมูลเดิมแบบอ่านอย่างเดียว
            return roster.map(r => ({
                id: null,
                memberName: r.name,
                amount: r.amount,
                status: r.paid ? 'PAID' : 'PENDING',
                owner: r.name === b.createdByName,
                hasSlip: false
            }));
        }

        async function reload() {
            b = await api.get('/api/v1/bills/' + id);
            cfg = {};
            try {
                cfg = b.splitConfigData ? JSON.parse(b.splitConfigData) : {};
            } catch {}
            const res = await Promise.all([
                api.get('/api/v1/bills/' + id + '/members'),
                api.get('/api/v1/bills/' + id + '/invitations').catch(() => [])
            ]);
            members = res[0];
            pending = res[1];
            // บิลที่สร้างก่อนมีระบบสมาชิก อาจยังไม่มีแถวเจ้าของบิล
            if (!members.some(m => m.userId === b.createdById)) {
                members.unshift({ userId: b.createdById, username: b.createdByName, email: '', role: 'OWNER' });
            }
            payments = await loadPayments();
            // เปลี่ยนสถานะสมาชิกแล้วสถานะรวมของบิลอาจเปลี่ยนตาม จึงโหลดบิลใหม่ทุกครั้ง
            render();
        }

        SM.ready.then(async ({ user }) => {
            me = user;
            if (!id) throw Object.assign(new Error('ไม่ได้ระบุบิล'), { status: 404 });
            await reload();
        }).catch(err => {
            const msg = err.status === 403
                ? 'คุณยังไม่ได้เป็นสมาชิกของบิลนี้ ขอรหัสจากเจ้าของบิลแล้วกด "เข้าร่วมบิล"'
                : err.status === 404 ? 'บิลอาจถูกลบไปแล้ว' : esc(err.message);
            $('#box').innerHTML = empty('🔍', 'เปิดบิลนี้ไม่ได้', msg,
                '<div class="row" style="justify-content:center"><button class="btn ghost" data-join>🔑 เข้าร่วมบิล</button><a class="btn" href="/bills">กลับไปบิลของฉัน</a></div>');
        });
    </script>
</body>

</html>
