<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ยินดีต้อนรับกลับมา - SplitMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <div class="auth">
        <section class="l">
            <div class="logo"><i>ıl</i>
                <div><b>SplitMate</b><small>EAT TOGETHER. PAY FAIR.</small></div>
            </div><span class="tag" style="width:fit-content">SMART BILL SPLITTING</span>
            <h1>กินด้วยกัน<br><em>จ่ายอย่างแฟร์</em></h1>
            <p class="muted" style="font-size:14px">เปลี่ยนทุกมื้อกับเพื่อนให้จบง่าย แบ่งตามที่กิน เช็กความแฟร์
                และลดจำนวนครั้งในการโอน</p>
        </section>
        <section class="r">
            <form id="f" class="card" method="post" action="/login" style="width:100%;max-width:380px;padding:28px"><span class="tag">WELCOME
                    BACK</span>
                <h1 style="font-size:24px;margin:10px 0 4px">ยินดีต้อนรับกลับมา</h1>
                <p class="muted" style="margin-bottom:18px">เข้าสู่ระบบเพื่อจัดการบิลของคุณ</p>
                <div class="field"><label>อีเมล</label><input class="in" name="email" type="email"
                        placeholder="name@email.com" required></div>
                <div class="field"><label>รหัสผ่าน</label><input class="in" name="password" type="password"
                        placeholder="อย่างน้อย 8 ตัวอักษร" required></div>
                <div class="err" id="err" th:if="${error}" th:text="${error}"></div><div class="ok" th:if="${success}" th:text="${success}"></div><button class="btn block">เข้าสู่ระบบ →</button>
                <p class="muted" style="text-align:center;margin-top:16px">ยังไม่มีบัญชี? <a href="/register"
                        style="color:var(--g-d);font-weight:600">สมัครสมาชิกฟรี</a></p>
            </form>
        </section>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
