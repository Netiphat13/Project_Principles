<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>รายละเอียดบิล - SplitMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="shell">
        <aside class="side"><a href="/home" class="logo"><i>ıl</i>
                <div><b>SplitMate</b><small>EAT TOGETHER. PAY FAIR.</small></div>
            </a><a class="nav" href="/home">🏠<span>แดชบอร์ด</span></a><a class="nav"
                href="/create-bill">➕<span>สร้างบิล</span></a><a class="nav active"
                href="/bills">🧾<span>บิลของฉัน</span></a><a class="nav"
                href="/groups">👥<span>กลุ่ม</span></a><a class="nav" href="/stats">📊<span>สถิติ</span></a><a
                class="nav" href="/profile">👤<span>โปรไฟล์</span></a>
            <div class="promo">✨<b>หารแฟร์ขึ้นอีกขั้น</b>ให้ Smart Split ช่วยแนะนำวิธีที่เหมาะที่สุด<br><a
                    href="/create-bill" style="color:var(--g-d);font-weight:600">ลองเลย →</a></div>
            <div class="me">
                <div class="av" data-pinit>P</div>
                <div><b style="font-size:13px" data-pname></b>
                    <div class="muted" style="font-size:10px" data-pemail></div>
                </div>
            </div>
        </aside>
        <div>
            <header class="top"><span class="muted">SplitMate › <b style="color:var(--ink)">รายละเอียดบิล</b></span>
                <div class="row"><input class="search" placeholder="ค้นหา..." aria-label="ค้นหา"><button
                        class="btn ghost" id="bell" style="padding:8px" aria-label="แจ้งเตือน">🔔</button><a
                        href="/profile" class="av" data-pinit>P</a></div>
            </header>
            <main class="main"><a href="/bills" style="color:var(--g-d);font-weight:600;font-size:12px">←
                    กลับไปบิลของฉัน</a>
                <div id="box" style="margin-top:12px"></div>
            </main>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>SM.ready.then(async () => {
          const id = qid();
          if (!Number.isFinite(id) || id <= 0) {
            $('#box').innerHTML = empty('🔍', 'ไม่พบรหัสบิล', 'ลิงก์รายละเอียดบิลไม่ถูกต้อง', '<a class="btn" href="/bills">กลับไปบิลของฉัน</a>');
            return;
          }

          let b;
          try {
            b = await api.get('/api/v1/bills/' + id);
          } catch (err) {
            $('#box').innerHTML = empty('⚠️', 'โหลดรายละเอียดบิลไม่สำเร็จ', esc(err.message || 'Unexpected server error'), '<a class="btn" href="/bills">กลับไปบิลของฉัน</a>');
            return;
          }

          let cfg = {};
          try {
            if (b && b.splitConfigData) {
              cfg = typeof b.splitConfigData === 'string' ? JSON.parse(b.splitConfigData) : b.splitConfigData;
            }
          } catch (e) { cfg = {}; }
          if (!cfg || typeof cfg !== 'object') cfg = {};

          const namesFromConfig = Array.isArray(cfg.members) ? cfg.members.filter(Boolean).map(String) : [];
          const members = namesFromConfig.length ? namesFromConfig : [b.createdByName || 'ผู้สร้างบิล'];
          const shares = cfg.shares && typeof cfg.shares === 'object'
            ? cfg.shares
            : Object.fromEntries(members.map(n => [n, Number(b.totalAmount || 0) / Math.max(1, members.length)]));
          const rawItems = Array.isArray(cfg.items) && cfg.items.length ? cfg.items : (Array.isArray(b.items) ? b.items : []);
          const items = rawItems.map(i => ({
            name: i.name || 'รายการอาหาร',
            qty: Number(i.qty ?? i.quantity ?? 1),
            price: Number(i.price ?? i.unitPrice ?? 0),
            icon: i.icon || '🍽️',
            eaters: Array.isArray(i.eaters) && i.eaters.length ? i.eaters.map(String) : members
          }));

          const itemHtml = items.map(i => {
            const eaters = esc(i.eaters.join(', '));
            return '<div><span style="font-size:20px">' + esc(i.icon) + '</span>' +
              '<div style="flex:1"><b>' + esc(i.name) + '</b><div class="muted">× ' + Number(i.qty || 1) + ' · กินโดย ' + eaters + '</div></div>' +
              '<b>' + baht(Number(i.price || 0) * Number(i.qty || 1)) + '</b></div>';
          }).join('');

          const shareHtml = members.map(n => {
            const paid = !!(cfg.paid && cfg.paid[n]);
            return '<div><b style="flex:1">' + esc(n) + '</b><b>' + baht(Number(shares[n] || 0)) + '</b>' +
              '<span class="pill ' + (paid ? 'paid' : 'pending') + '">' + (paid ? 'จ่ายแล้ว' : 'รอจ่าย') + '</span></div>';
          }).join('');

          const foodSection = items.length
            ? '<div class="list">' + itemHtml + '</div>' +
              '<h2 style="margin:18px 0 4px">ยอดที่แต่ละคนต้องจ่าย</h2>' +
              '<div class="list">' + shareHtml + '</div>' +
              '<p class="muted" style="margin-top:10px">ส่วนลด ' + baht(b.discount) + ' · Service ' + baht(b.serviceCharge) + ' · VAT ' + baht(b.vat) + ' · Fairness ' + Number(cfg.fairness || 0) + '/100</p>'
            : empty('🍽️', 'ยังไม่มีรายการ', 'บิลนี้ไม่มีรายการอาหาร');

          $('#box').innerHTML = '<div class="head"><div><span class="tag">BILL DETAIL</span><h1>' +
            esc(b.restaurantName || 'บิลไม่มีชื่อ') + '</h1><p class="muted">📅 ' + fmtDate(b.billDate) + ' ' +
            esc(b.billTime ? String(b.billTime).slice(0,5) : '') + '</p></div><span class="pill ' + statusKey(b.status) +
            '" style="font-size:13px">' + esc(ST[b.status] || b.status || 'รอจ่าย') + '</span></div>' +
            '<div class="grid g2"><div class="card"><h2>ข้อมูลบิล</h2>' +
            '<div class="kv"><span class="muted">ยอดรวม</span><b>' + baht(b.totalAmount) + '</b></div>' +
            '<div class="kv"><span class="muted">จำนวนคน</span><b>' + members.length + ' คน</b></div>' +
            '<div class="kv"><span class="muted">เฉลี่ยต่อคน</span><b>' + baht(Number(b.totalAmount || 0) / Math.max(1,members.length)) + '</b></div>' +
            '<div class="kv"><span class="muted">วิธีหาร</span><span>' + esc(b.splitMethod || 'equal') + '</span></div>' +
            '<div class="kv"><span class="muted">โน้ต</span><span>' + (esc(b.note) || '-') + '</span></div></div>' +
            '<div class="card"><h2>จัดการบิล</h2><div class="field" style="margin-top:12px"><label>สถานะการชำระ</label>' +
            '<select class="in" id="s"><option value="PENDING">รอจ่าย</option><option value="PAID">จ่ายแล้ว</option>' +
            '<option value="OVERDUE">เกินกำหนด</option><option value="CANCELLED">ยกเลิก</option></select></div>' +
            '<button class="btn danger block" id="del">ลบบิลนี้</button></div></div>' +
            '<div class="card" style="margin-top:16px"><h2>รายการอาหารและผู้ร่วมจ่าย</h2>' + foodSection + '</div>';

          $('#s').value = b.status || 'PENDING';
          $('#s').onchange = async e => {
            try { await api.patch('/api/v1/bills/' + id + '/status', { status: e.target.value }); notify('อัปเดตสถานะบิลเรียบร้อยแล้ว'); location.reload(); }
            catch (err) { alert('อัปเดตสถานะไม่สำเร็จ: ' + err.message); }
          };
          $('#del').onclick = async () => {
            if (!confirm('ลบบิลนี้ใช่หรือไม่?')) return;
            try { await api.delete('/api/v1/bills/' + id); location = '/bills'; }
            catch (err) { alert('ลบบิลไม่สำเร็จ: ' + err.message); }
          };
        }).catch(err => {
          $('#box').innerHTML = empty('⚠️', 'เกิดข้อผิดพลาด', esc(err.message || 'Unexpected server error'), '<a class="btn" href="/bills">กลับไปบิลของฉัน</a>');
        })</script>
</body>

</html>
