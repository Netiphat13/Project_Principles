<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>กลุ่ม - SplitMate</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="shell">
        <aside class="side"><a href="/home" class="logo"><i>ıl</i>
                <div><b>SplitMate</b><small>EAT TOGETHER. PAY FAIR.</small></div>
            </a><a class="nav" href="/home">🏠<span>แดชบอร์ด</span></a><a class="nav"
                href="/create-bill">➕<span>สร้างบิล</span></a><a class="nav"
                href="/bills">🧾<span>บิลของฉัน</span></a><a class="nav active"
                href="/groups">👥<span>กลุ่ม</span></a><a class="nav" href="/stats">📊<span>สถิติ</span></a><a
                class="nav" href="/profile">👤<span>โปรไฟล์</span></a>
            <div class="promo">✨<b>หารแฟร์ขึ้นอีกขั้น</b>ให้ Smart Split ช่วยแนะนำวิธีที่เหมาะที่สุด<br><a
                    href="/create-bill" style="color:var(--g-d);font-weight:600">ลองเลย →</a></div>
            <div class="me">
                <div class="av" data-pinit>P</div>
                <div><b style="font-size:13px" data-pname></b>
                    <div class="muted" style="font-size:10px" data-pemail></div>
                </div>
            </div>
        </aside>
        <div>
            <header class="top"><span class="muted">SplitMate › <b style="color:var(--ink)">กลุ่ม</b></span>
                <div class="row"><input class="search" placeholder="ค้นหา..." aria-label="ค้นหา"><button
                        class="btn ghost" id="bell" style="padding:8px" aria-label="แจ้งเตือน">🔔</button><a
                        href="/profile" class="av" data-pinit>P</a></div>
            </header>
            <main class="main"><a href="/groups" style="color:var(--g-d);font-weight:600;font-size:12px">←
                    กลับไปที่กลุ่ม</a>
                <div id="box" style="margin-top:12px"></div>
            </main>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>SM.ready.then(async ({user}) => {
          const id = qid(); let g
          try { g = await api.get('/api/v1/groups/' + id) } catch (err) { $('#box').innerHTML = empty('🔍', 'ไม่พบกลุ่มนี้', esc(err.message), '<a class="btn" href="/groups">กลับไปที่กลุ่ม</a>'); return }
          const members = await api.get('/api/v1/groups/' + id + '/members').catch(() => [])
          const code = 'SM-' + String(g.id).padStart(4, '0')
          $('#box').innerHTML = `<div class="card row sp mint" style="margin-bottom:16px;flex-wrap:wrap"><div class="row"><span style="font-size:36px">👥</span><div><span class="tag">ACTIVE GROUP</span><h1 style="font-size:26px">${esc(g.name)}</h1><span class="muted">${g.memberCount} สมาชิก · สร้างโดย ${esc(g.createdByName)}</span></div></div><div class="row"><span class="muted">รหัสอ้างอิง</span><span class="code">${code}</span><button class="btn ghost" id="cp">คัดลอก</button></div></div><div class="grid g3"><div class="card stat"><span class="muted">ค่าใช้จ่ายรวม</span><b>฿0</b></div><div class="card stat"><span class="muted">จำนวนบิล</span><b>0</b></div><div class="card stat"><span class="muted">สมาชิก</span><b>${g.memberCount}</b></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2>สมาชิก</h2><div class="list">${members.length ? members.map((m, i) => `<div><div class="av">${esc((m.username || '?')[0].toUpperCase())}</div><div style="flex:1"><b>${esc(m.username)}</b><div class="muted">${Number(m.id) === Number(g.createdById) ? 'ผู้สร้างกลุ่ม' : 'สมาชิก'}</div></div></div>`).join('') : empty('👥', 'ยังไม่มีสมาชิก', '')}</div></div><div class="card"><h2>บิลล่าสุด</h2>${empty('🧾', 'ยังไม่มีบิลในกลุ่ม', 'เวอร์ชันนี้ยังไม่ได้ผูกบิลเข้ากับกลุ่ม')}</div></div>`
          $('#cp').onclick = () => navigator.clipboard?.writeText(code)
        }).catch(err => console.error(err))</script>
</body>

</html>
